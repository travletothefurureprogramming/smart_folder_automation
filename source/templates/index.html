<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Folder Automation Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background:#f8f9fa;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
            background:white;
        }

        .metric-number{
            font-size:4rem;
            font-weight:700;
            color:#0d6efd;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <h1 class="text-center mb-5">
        <i class="bi bi-pc-display"></i>
        SMART FOLDER AUTOMATION HUB
    </h1>

    <div class="row justify-content-center">
        <div class="col-lg-4 col-md-6">
            <div class="card p-4 text-center">

                <div class="mb-3">
                    <span class="badge bg-primary p-3 rounded-circle">
                        <i class="bi bi-list-ol fs-4"></i>
                    </span>
                </div>

                <h5 class="fw-semibold mb-2">Files Moved</h5>

                <div id="count" class="metric-number">0</div>

            </div>
        </div>
    </div>

</div>

<script>
const SERVER = window.location.origin;

function updateSystemInfo(){
    fetch(`${SERVER}/api/count`)
    .then(response => response.json())
    .then(data => {
        document.getElementById("count").innerHTML = data.moved_files;
    });
}

updateSystemInfo();
setInterval(updateSystemInfo, 3000);
</script>

</body>
</html>
